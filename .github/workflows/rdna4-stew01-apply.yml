# Cheap canary: does stew 01 still apply to current llama.cpp?
# No GPUs. Failure is a signal, not a product red. Do not apply-all.
name: rdna4-stew01-apply

on:
  push:
  pull_request:
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:

jobs:
  stew01-apply:
    runs-on: ubuntu-latest
    steps:
      - name: checkout this fork
        uses: actions/checkout@v4
      - name: checkout stew675/llama-cpp-rdna-boosts
        uses: actions/checkout@v4
        with:
          repository: stew675/llama-cpp-rdna-boosts
          path: .stew-boosts
      - name: git apply 01-adaptive-mtp --check
        run: |
          set -euo pipefail
          patch=".stew-boosts/patches/01-adaptive-mtp.patch"
          test -f "$patch"
          if git apply --check "$patch"; then
            echo "STEW01_APPLY=clean"
          else
            echo "STEW01_APPLY=fail (expected when llama master drifts past stew's pin)"
            git apply --check "$patch" || true
            exit 0
          fi
